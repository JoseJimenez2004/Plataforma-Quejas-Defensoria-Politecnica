<div class="min-h-screen flex flex-col">
  <!-- Header guinda IPN -->
  <header class="bg-ipn-maroon text-white flex-shrink-0">
    <div class="flex items-center justify-between px-6 py-3">
      <div class="flex items-center gap-3">
        <img
          src="/assets/ipn-logo.png"
          alt="IPN"
          class="h-10"
          onerror="this.style.display = 'none'"
        />
        <img
          src="/assets/ddp-logo.png"
          alt="DDP"
          class="h-10"
          onerror="this.style.display = 'none'"
        />
      </div>
      <div class="flex items-center gap-4">
        @if (perfil) {
          <span class="text-sm flex items-center gap-1"> <lucide-icon name="user" class="w-4 h-4" /> {{ perfil.nombre }} </span>
        }
        <button
          (click)="cerrarSesion()"
          class="border border-white text-white text-sm px-4 py-1.5 rounded hover:bg-red-900 transition"
        >
          Cerrar Sesión
        </button>
      </div>
    </div>
    <nav class="px-6 pb-2 flex gap-6 text-sm font-medium">
      <a routerLink="/" class="hover:underline">Inicio</a>
      <a href="#" class="hover:underline">Conócenos</a>
      <a href="#" class="hover:underline">Orientación</a>
      <a routerLink="/queja/nueva" class="hover:underline">Queja</a>
      <a href="#" class="hover:underline">Contacto</a>
    </nav>
  </header>

  <!-- Body: sidebar + content -->
  <div class="flex flex-1">
    <!-- Sidebar -->
    <aside class="w-48 bg-white border-r border-gray-200 flex-shrink-0">
      <nav class="py-4">
        <a
          routerLink="/dashboard"
          routerLinkActive="bg-gray-100 font-semibold"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center gap-2 px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 cursor-pointer"
        >
          <lucide-icon name="clipboard-list" class="w-4 h-4 text-ipn-maroon" /> Resumen
        </a>
        <a
          routerLink="/dashboard/historial"
          routerLinkActive="bg-gray-100 font-semibold"
          class="flex items-center gap-2 px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 cursor-pointer"
        >
          <lucide-icon name="folder" class="w-4 h-4 text-ipn-maroon" /> Mis Quejas
        </a>
        <a
          routerLink="/dashboard/nueva"
          routerLinkActive="bg-gray-100 font-semibold"
          class="flex items-center gap-2 px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 cursor-pointer"
        >
          <lucide-icon name="circle-plus" class="w-4 h-4 text-ipn-maroon" /> Nueva Queja
        </a>
        <a
          routerLink="/dashboard/notificaciones"
          routerLinkActive="bg-gray-100 font-semibold"
          class="flex items-center gap-2 px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 cursor-pointer"
        >
          <span class="relative">
            <lucide-icon name="bell" class="w-4 h-4 text-ipn-maroon" />
            @if (notifNoLeidas > 0) {
              <span
                class="absolute -top-1 -right-1 bg-red-500 text-white text-xs w-4 h-4 rounded-full flex items-center justify-center"
              >
                {{ notifNoLeidas }}
              </span>
            }
          </span>
          Notificaciones
        </a>
        <a
          routerLink="/dashboard/perfil"
          routerLinkActive="bg-gray-100 font-semibold"
          class="flex items-center gap-2 px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 cursor-pointer"
        >
          <lucide-icon name="settings" class="w-4 h-4 text-ipn-maroon" /> Perfil
        </a>
      </nav>
    </aside>

    <!-- Main content -->
    <main class="flex-1 bg-gray-100 overflow-auto">
      <router-outlet />
    </main>
  </div>

  <!-- Footer -->
  <footer class="bg-ipn-maroon text-white text-center py-4 text-xs flex-shrink-0">
    <div class="flex justify-center gap-4">
      <a href="#" class="hover:underline">Aviso de Privacidad</a>
      <a href="#" class="hover:underline">Marco Normativo</a>
    </div>
  </footer>
</div>
