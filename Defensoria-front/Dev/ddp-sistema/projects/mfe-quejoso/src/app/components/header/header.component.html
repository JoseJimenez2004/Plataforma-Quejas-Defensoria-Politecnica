@if (!autenticado) {
  <!-- Header público (sin sesión) -->
  <header class="bg-gray-800 text-white flex-shrink-0">
    <div class="bg-ipn-maroon py-1 px-4 text-xs flex justify-between items-center">
      <div class="flex items-center gap-2">
        <img
          src="assets/Logo_GobMx.png"
          alt="Gobierno de México"
          class="h-6"
          onerror="this.style.display = 'none'"
        />
      </div>
      <div class="flex gap-4">
        <a
          href="https://www.gob.mx/"
          target="_blank"
          rel="noopener noreferrer"
          class="hover:underline"
          >Trámites</a
        >
        <a
          href="https://www.gob.mx/gobierno"
          target="_blank"
          rel="noopener noreferrer"
          class="hover:underline"
          >Gobierno</a
        >
      </div>
    </div>
    <div class="bg-white flex items-center justify-between px-6 py-1">
      <img src="assets/logo_ipn.png" alt="IPN" class="h-24" onerror="this.style.display = 'none'" />
      <img
        src="assets/SecEdPub_Logo.png"
        alt="Secretaría de Educación Pública"
        class="h-10"
        onerror="this.style.display = 'none'"
      />
    </div>
    <nav class="px-6 pt-4 pb-3 flex gap-6 text-sm font-medium">
      <a
        routerLink="/"
        routerLinkActive="border-b-2 border-white pb-0.5"
        [routerLinkActiveOptions]="{ exact: true }"
        class="hover:underline"
        >Inicio</a
      >
      <a
        href="https://www.ipn.mx/defensoria/conocenos/"
        target="_blank"
        rel="noopener noreferrer"
        class="hover:underline"
        >Conócenos</a
      >
      <a
        href="https://www.ipn.mx/defensoria/orientacion.html"
        target="_blank"
        rel="noopener noreferrer"
        class="hover:underline"
        >Orientación</a
      >
      <a
        routerLink="/queja/nueva"
        routerLinkActive="border-b-2 border-white pb-0.5"
        class="hover:underline"
        >Queja</a
      >
      <a
        href="https://www.ipn.mx/defensoria/contacto.html"
        target="_blank"
        rel="noopener noreferrer"
        class="hover:underline"
        >Contacto</a
      >
    </nav>
  </header>
} @else {
  <!-- Header autenticado (dashboard) -->
  <header class="bg-gray-900 text-white flex-shrink-0">
    <div class="bg-white flex items-center justify-between px-6 py-2">
      <img src="assets/logo_ipn.png" alt="IPN" class="h-20" onerror="this.style.display = 'none'" />
      <div class="flex items-center gap-4">
        @if (perfil) {
          <span class="text-sm flex items-center gap-1.5 text-gray-800">
            <lucide-icon name="user" class="w-4 h-4" /> {{ perfil.nombre }}
          </span>
        }
        <button
          (click)="cerrarSesion()"
          class="bg-ipn-maroon text-white text-sm font-semibold px-4 py-1.5 rounded hover:bg-red-900 transition"
        >
          Cerrar Sesión
        </button>
      </div>
    </div>
    <nav class="px-6 py-3 flex gap-6 text-sm font-medium">
      <a
        routerLink="/dashboard"
        routerLinkActive="border-b-2 border-white pb-0.5"
        [routerLinkActiveOptions]="{ exact: true }"
        class="hover:underline"
        >Inicio</a
      >
      <a
        href="https://www.ipn.mx/defensoria/conocenos/"
        target="_blank"
        rel="noopener noreferrer"
        class="hover:underline"
        >Conócenos</a
      >
      <a
        href="https://www.ipn.mx/defensoria/orientacion.html"
        target="_blank"
        rel="noopener noreferrer"
        class="hover:underline"
        >Orientación</a
      >
      <a
        href="https://www.ipn.mx/defensoria/contacto.html"
        target="_blank"
        rel="noopener noreferrer"
        class="hover:underline"
        >Contacto</a
      >
    </nav>
  </header>
}
