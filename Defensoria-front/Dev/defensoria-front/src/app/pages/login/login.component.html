<div class="header-band">
  <div class="nav-links">
    <span>Inicio</span>
    <span>Conócenos</span>
    <span>Orientación</span>
    <span>Queja</span>
    <span>Contacto</span>
  </div>
</div>

<div class="login-page">
  <div class="login-card">
    <div class="card-header">
      <img src="assets/logo-ipn.png" alt="Logo" class="logo"> <h1>Portal de Seguimiento de Quejas</h1>
      <p>Ingresa tus credenciales para gestionar tus trámites.</p>
    </div>

    <form (submit)="onLogin()" #loginForm="ngForm">
      <div class="input-group">
        <label><i class="fa fa-user"></i> Usuario / Correo</label>
        <input type="email" [(ngModel)]="loginData.email" name="email" required placeholder="ejemplo@ipn.mx">
      </div>

      <div class="input-group">
        <label><i class="fa fa-lock"></i> Contraseña</label>
        <input type="password" [(ngModel)]="loginData.password" name="password" required placeholder="********">
      </div>

      <button type="submit" class="btn-login">Iniciar Sesión</button>
    </form>

    <div class="card-footer">
      <a href="#">¿Olvidaste tu contraseña?</a>
      <p>¿No tienes cuenta? <a href="#">¡Regístrate aquí!</a></p>
      
      <div class="support-info">
        <i class="fa fa-info-circle"></i>
        <span>Si tienes problemas para acceder, contacta a soporte técnico de la Defensoría.</span>
      </div>
    </div>
  </div>
</div>
