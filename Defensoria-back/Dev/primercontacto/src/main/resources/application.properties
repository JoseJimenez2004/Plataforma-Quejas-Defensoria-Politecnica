# --- Servidor ---
server.port=8082

# --- Configuración de H2 en memoria ---
spring.datasource.url=jdbc:h2:mem:defensoriadb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Consola de H2 ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- INICIALIZACIÓN DE DATOS (CRÍTICO) ---
# Forzar ejecución de scripts SQL
spring.sql.init.mode=always
# Esperar a que Hibernate genere las tablas de abogados/expedientes
spring.jpa.defer-datasource-initialization=true
# Mostrar el SQL de inserción en consola
spring.jpa.properties.hibernate.format_sql=true