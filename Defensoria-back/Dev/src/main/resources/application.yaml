spring:
  application:
    name: defensoria
  
  datasource:
    # 'db-defensoria' será el nombre del servicio en nuestro docker-compose
    url: jdbc:postgresql://db-defensoria:5432/defensoria_db
    username: admin_user
    password: password_seguro
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'update' creará las tablas de quejas 
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect