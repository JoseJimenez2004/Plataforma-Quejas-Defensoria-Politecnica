<div style="max-width: 400px; margin: 50px auto; font-family: sans-serif; border: 1px solid #ccc; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
  <h2 style="text-align: center; color: #6c1d45;">Acceso Administrativo</h2>
  
  <form [formGroup]="loginForm" (ngSubmit)="iniciarSesion()" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
    
    <div>
      <label style="display: block; margin-bottom: 5px; font-weight: bold;">Correo Institucional:</label>
      <input type="email" formControlName="correo" placeholder="ejemplo@ipn.mx" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
      <div *ngIf="loginForm.get('correo')?.invalid && loginForm.get('correo')?.touched" style="color: red; font-size: 12px; margin-top: 5px;">
        Ingresa un correo válido (ej. ti&#64;ipn.mx).
      </div>
    </div>

    <div>
      <label style="display: block; margin-bottom: 5px; font-weight: bold;">Contraseña:</label>
      <input type="password" formControlName="password" placeholder="********" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
    </div>

    <div *ngIf="mensajeError" style="color: red; font-size: 14px; font-weight: bold; text-align: center;">
      {{ mensajeError }}
    </div>

    <button type="submit" style="padding: 12px; background-color: #6c1d45; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px;">
      Entrar
    </button>

  </form>
</div>
