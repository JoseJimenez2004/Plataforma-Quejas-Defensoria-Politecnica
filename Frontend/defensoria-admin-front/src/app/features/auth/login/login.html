<div class="pantalla-completa">
  <header>
    <div class="header-top"></div>
    <div class="header-main">
      <h1 class="titulo-header">Defensoría de los Derechos Politécnicos - Administración</h1>
    </div>
  </header>

  <main class="contenido-central">
    <div class="tarjeta-auth">
      <h2 class="titulo-tarjeta">Portal de<br>Gestión Administrativa</h2>
      
      <form [formGroup]="loginForm" (ngSubmit)="iniciarSesion()">
        <div class="grupo-input">
          <label>Correo Institucional</label>
          <input type="email" formControlName="correo" placeholder="ejemplo@ipn.mx">
        </div>

        <div class="grupo-input">
          <label>Contraseña</label>
          
          <div class="password-container">
            <input [type]="mostrarPassword ? 'text' : 'password'" formControlName="password" placeholder="••••••••">
            
            <button type="button" class="btn-toggle-password" (click)="togglePassword()">
              
              <svg *ngIf="!mostrarPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>

              <svg *ngIf="mostrarPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          </div>

        <div *ngIf="mensajeError" style="color: #dc2626; font-size: 0.85rem; margin-bottom: 15px; font-weight: 500;">
          {{ mensajeError }}
        </div>

        <button type="submit" class="btn-guinda">Iniciar sesión</button>
      </form>

      <a class="enlace-dorado" (click)="irARecuperar()">¿Olvidaste tu contraseña?</a>
    </div>
  </main>

  <footer class="footer-dark">
    © 2026 Instituto Politécnico Nacional
  </footer>
</div>
