services:
  # 1. Base de datos PostgreSQL para el sistema de quejas
  db-defensoria:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: always
    environment:
      - POSTGRES_DB=defensoria_db
      - POSTGRES_USER=defensoria
      - POSTGRES_PASSWORD="Bicho_IPN_2026!"
    ports:
      - "5432:5432"
    volumes:
      - "./BaseDatos/init.sql:/docker-entrypoint-initdb.d/init.sql"
      - postgres_data:/var/lib/postgresql/data

  # 2. Backend (Spring Boot)
  backend:
    build: ./Defensoria-back/Dev
    container_name: spring-backend
    restart: on-failure
    ports:
      - "8080:8080"
    depends_on:
      - db-defensoria
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-defensoria:5432/defensoria_db
      - SPRING_DATASOURCE_USERNAME=defensoria  
      - SPRING_DATASOURCE_PASSWORD="Bicho_IPN_2026!"
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate 

  # 3. Frontend (Angular)
  frontend:
    build: ./Defensoria-front/Dev
    container_name: angular-frontend
    restart: always
    ports:
      - "4200:4200"
    stdin_open: true
    tty: true
    depends_on:
      - backend

volumes:
  postgres_data: