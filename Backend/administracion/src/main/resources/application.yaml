server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: administracion

  # ---------------------------------------------------------
  # Configuración de Conexión a PostgreSQL (Neon / Vercel)
  # ---------------------------------------------------------
  datasource:
    url: jdbc:postgresql://ep-dry-dew-aidiojqw-pooler.c-4.us-east-1.aws.neon.tech/neondb?sslmode=require&currentSchema=defensoria
    username: neondb_owner
    password: npg_41TzgIinHmsU
    driver-class-name: org.postgresql.Driver

  # ---------------------------------------------------------
  # Configuración de JPA / Hibernate
  # ---------------------------------------------------------
  jpa:
    hibernate:
      # Verifica que el código Java coincida con las tablas SQL
      ddl-auto: validate
    
    # Muestra las consultas SQL en la consola
    show-sql: true
    
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: defensoria

# ---------------------------------------------------------
# Configuración de Logs
# ---------------------------------------------------------
logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE # Muestra los parámetros exactos de las consultas