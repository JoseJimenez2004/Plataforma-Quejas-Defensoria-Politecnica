# Configuraci\u00f3n del Servidor
server.port=8082
spring.application.name=usuarios

# Configuraci\u00f3n de Base de Datos H2
spring.datasource.url=jdbc:h2:mem:usuariosDB
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# IMPORTANTE: Permitir que la consola H2 se vea con Spring Security
spring.h2.console.settings.web-allow-others=true

# Configuraci\u00f3n de Correo (Gmail con tu c\u00f3digo de aplicaci\u00f3n)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=jair100flo@gmail.com
spring.mail.password=rozzvatswkacxvqf
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Logs para ver qu\u00e9 pasa con Hibernate
logging.level.org.hibernate.SQL=DEBUG