spring.application.name=quejoso
server.port=8080

# ==========================================
# 1. CONEXIÓN A BASE DE DATOS (PostgreSQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ddp_admin_db?currentSchema=defensoria
spring.datasource.username=admin_defensoria
spring.datasource.password=AdminDDP2026!
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# Nota: Si necesitas que Spring cree las tablas por ti, cambia 'validate' por 'update'
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

