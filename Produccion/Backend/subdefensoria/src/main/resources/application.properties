spring.application.name=subdefensoria-service
server.port=8083

# Base compartida defensoria_db (PostgreSQL), igual que Primer Contacto. Antes era H2 en
# memoria y todo se perdía al reiniciar. Sus tablas (expedientes_investigacion,
# oficios_informacion, recordatorios_urgencia, respuestas_externas, acuerdos_conclusion) ya
# existen en la base con este mismo esquema; ddl-auto=update solo agrega columnas nuevas.
# En local: dev-local de primercontacto (puerto 5433).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/defensoria_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Origenes (separados por coma) desde los que el navegador puede
# llamar a esta API: el front de Subdefensoria.
cors.allowed-origins=http://localhost:4301

# URL base del microservicio de Primer Contacto.
primer-contacto.base-url=http://localhost:8082

# Plazos
plazos.primera-solicitud-dias=10
plazos.recordatorio-dias=5

# JWT compartido con admin-service y los demás servicios protegidos.
# El valor real se obtiene mediante variable de entorno.
jwt.secret=${JWT_SECRET}

# Centro de notificaciones + correo del quejoso (notificaciones-service): Subdefensoría le
# avisa del acuerdo de conciliación y de la conclusión de su caso.
notificaciones.service.url=http://localhost:8085

# Correo a la unidad académica con el oficio/recordatorio en PDF adjunto. Mientras se valida,
# redirigir-a manda TODO a un correo de prueba; vacío = al destinatario real del oficio.
correo.unidad-academica.habilitado=true
correo.unidad-academica.redirigir-a=

# Portal del quejoso: base del enlace con que acepta o rechaza el acuerdo de conciliación.
subdefensoria.portal.url=http://localhost:4200

# Archivo de la respuesta del director (CU-SD-08): PDF, JPG o PNG de hasta 10 MB.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Swagger UI / OpenAPI 3 (mismas rutas que el resto de los microservicios)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
