server:
  port: 8092

spring:
  application:
    name: historico-service
  datasource:
    # Base SEPARADA de defensoria_db: las quejas históricas son de solo consulta y no
    # comparten ciclo de vida con las del sistema.
    url: jdbc:postgresql://localhost:5432/defensoria_historico_db
    username: postgres
    password: Temporal2026@
    driver-class-name: org.postgresql.Driver
  jpa:
