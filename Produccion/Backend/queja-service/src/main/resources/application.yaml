server:
  port: 8084

spring:
  application:
    name: queja-service
  datasource:
    url: jdbc:postgresql://localhost:5432/defensoria_db
    username: postgres
    password: Temporal2026@
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      # Por archivo (antes bastaba con 1 evidencia); ahora pueden ser varios en la misma
      # petición, así que max-request-size (el total combinado) se subió también.
      # NOTA: el overhead de multipart (boundaries, headers por parte) hace que el
      # Content-Length real sea mayor a la suma de los archivos — se deja margen extra.
      max-file-size: 30MB
      max-request-size: 100MB

jwt:
  secret: defensoria-ddp-jwt-secret-produccion-muy-segura-2026

notificaciones:
  service:
    url: http://localhost:8085

# NOTA: ya no se usa almacenamiento en disco para evidencias — se guardan completas como
# BYTEA en la tabla queja_evidencias (ver entity/QuejaEvidencia.java y docs/CAMBIOS.md).

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    level: "%5p [${spring.application.name}]"
