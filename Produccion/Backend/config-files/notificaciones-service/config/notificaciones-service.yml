server:
  # Puerto interno unificado a 8080 en los 9 microservicios -- el acceso real sigue siendo
  # por 8085, ahora vía el mapeo externo de Podman (ver -p en podman-compose.sh).
  port: 8080

spring:
  application:
    name: notificaciones-service
  # Antes este servicio no tenía base de datos (era "fire-and-forget" de correo saliente) y
  # desactivaba por completo el motor automático de JPA/datasource. Ahora persiste un centro
  # de notificaciones por usuario (entidad Notificacion), así que necesita conexión real.
  datasource:
    url: jdbc:postgresql://169.58.62.99:5432/defensoria_db
    username: postgres
    password: Temporal2026@
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

  cloud:
    compatibility-verifier:
      enabled: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: josebryanomar2004@gmail.com
    password: kstwxawsnsqkzhnk
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # Sin estos, si el proveedor del VPS bloquea el puerto 587 el envío se cuelga para siempre.
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

jwt:
  secret: defensoria-ddp-jwt-secret-produccion-muy-segura-2026
  expiration: 3600000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    level: "%5p [${spring.application.name}]"
