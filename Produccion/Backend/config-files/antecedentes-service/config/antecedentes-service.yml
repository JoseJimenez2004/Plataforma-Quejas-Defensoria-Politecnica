server:
  # Puerto interno unificado a 8080 -- el acceso real es por 8093 vía el mapeo
  # externo de Podman (ver -p en podman-compose-modelo.sh).
  port: 8080
  tomcat:
    threads:
      max: 20

spring:
  application:
    name: antecedentes-service

# Modelo de IA: búsqueda de antecedentes (TF-IDF + coseno) y resumen extractivo (TextRank).
# Los datasets viven en el volumen /app/data (montado desde $BASE_DIR/modelo/Dataset).
# quejas_aprendidas.json lo escribe el propio servicio cada vez que aprende quejas nuevas.
ia:
  dataset:
    historico: /app/data/quejas_sinteticas.json
    nuevo: /app/data/quejas_prueba_30.json
    aprendidas: /app/data/quejas_aprendidas.json
  busqueda:
    # Consultas cortas dan ~0.25-0.30; una queja completa contra casos parecidos da 0.55-0.75.
    # Subir a 0.70 cuando se comparen quejas completas y el corpus tenga cientos de casos.
    umbral: 0.25
    top-k: 5
    top-k-maximo: 50
  resumen:
    numero-oraciones: 3
    numero-oraciones-maximo: 20
    redundancia: 0.60

logging:
  pattern:
    level: "%5p [${spring.application.name}]"
