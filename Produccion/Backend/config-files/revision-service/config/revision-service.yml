server:
  # Puerto interno unificado a 8080 en los 9 microservicios -- el acceso real sigue siendo
  # por 8088, ahora vía el mapeo externo de Podman (ver -p en podman-compose.sh).
  port: 8080

spring:
  application:
    name: revision-service
  datasource:
    url: jdbc:postgresql://2.25.78.22:5432/defensoria_db
    username: postgres
    password: Temporal2026@
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

  cloud:
    compatibility-verifier:
      enabled: false

# Mismo secreto que el resto de microservicios -- un JWT emitido por admin-service (que es
# quien hace login del personal) es valido aqui tambien.
jwt:
  secret: defensoria-ddp-jwt-secret-produccion-muy-segura-2026
  expiration: 3600000

catalogo:
  service:
    url: http://2.25.78.22:8086

notificaciones:
