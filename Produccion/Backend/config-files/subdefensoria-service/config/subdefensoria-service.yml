# Config de producción de subdefensoria-service — COPIA DE REFERENCIA del servidor.
#
# La real vive en el backend (156.67.26.73):
#   /apps/aplicaciones/defensoria/back/config-files/subdefensoria-service/config/subdefensoria-service.yml
# Esta copia es igual SALVO la contraseña y el secreto JWT, que no se suben al repo: en el
# servidor son los mismos que usa revision-service.yml.
#
# IMPORTANTE: el contenedor arranca con SPRING_CONFIG_NAME=subdefensoria-service (ver
# podman-compose.sh), así que el application.properties del jar NO se carga. Todo lo que
# necesita el servicio tiene que estar aquí: sin datasource, jwt.secret y plazos no arranca.
#
# Puertos: interno 8080; el acceso real es por 8091 (mapeo -p de podman-compose.sh). 8083 lo
# usa auth-service en esta misma VPS.

server:
  port: 8080

spring:
  application:
    name: subdefensoria-service
  # Antes era H2 en memoria (se perdía todo al reiniciar). Sus tablas ya existen en
  # defensoria_db con este esquema; ddl-auto=update solo agrega columnas nuevas.
  datasource:
    url: jdbc:postgresql://169.58.62.99:5432/defensoria_db
    username: postgres
    password: "<la misma de revision-service.yml>"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

jwt:
  secret: "<el mismo de revision-service.yml>"

cors:
  allowed-origins: https://defensoria-escom.ddns.net

# Primer Contacto, en la misma VPS backend.
primer-contacto:
  base-url: http://156.67.26.73:8082

# Plazos de los oficios (días).
plazos:
  primera-solicitud-dias: 10
  recordatorio-dias: 5

# Centro de notificaciones + correo del quejoso, en la misma VPS backend.
notificaciones:
  service:
    url: http://156.67.26.73:8085

subdefensoria:
  # Refleja el avance del expediente en quejas.estatus (panel del quejoso).
  sincronizar-estatus-queja: true
  # Página pública del portal a la que lleva el enlace del acuerdo de conciliación.
  portal:
    url: https://defensoria-escom.ddns.net
