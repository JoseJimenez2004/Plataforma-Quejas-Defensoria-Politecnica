# Config de producción de primer-contacto-service — COPIA DE REFERENCIA del servidor.
#
# La real vive en el backend (156.67.26.73):
#   /apps/aplicaciones/defensoria/back/config-files/primer-contacto-service/config/primer-contacto-service.yml
# Se desplegó el 2026-10-08. Esta copia es igual SALVO la contraseña y el secreto JWT, que no
# se suben al repo: en el servidor son los mismos que usa revision-service.yml.
#
# IMPORTANTE: el contenedor arranca con SPRING_CONFIG_NAME=primer-contacto-service, así que el
# application.properties del jar NO se carga. Todo lo que necesita el servicio tiene que estar
# aquí. Si se reemplaza el archivo del servidor con esta copia, hay que volver a poner la
# contraseña y el secreto o el servicio no arranca.

server:
  # Puerto interno; el acceso real es por 8082 (mapeo -p de podman-compose.sh).
  port: 8080

spring:
  application:
    name: primer-contacto-service
  datasource:
    url: jdbc:postgresql://169.58.62.99:5432/defensoria_db
    username: postgres
    password: "<la misma de revision-service.yml>"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

jwt:
  secret: "<el mismo de revision-service.yml>"

cors:
  allowed-origins: https://defensoria-escom.ddns.net

# Subdefensoría y notificaciones, en la misma VPS backend.
subdefensoria:
  base-url: http://156.67.26.73:8091
notificaciones:
  service:
    url: http://156.67.26.73:8085

# Modelo de antecedentes del compañero (antecedentes-service). Se le piden todos sus resultados
# y Primer Contacto se queda con los del mismo quejoso o denunciado.
antecedentes:
  modelo:
    url: http://156.67.26.73:8093
    umbral: 0.0

# Casos históricos (solo lectura). Ojo: la base se llama defensoria_historico_db.
historico:
  datasource:
    url: jdbc:postgresql://169.58.62.99:5433/defensoria_historico_db
    username: postgres
    password: "<la misma de revision-service.yml>"

primer-contacto:
  sincronizar-estatus-queja: false
