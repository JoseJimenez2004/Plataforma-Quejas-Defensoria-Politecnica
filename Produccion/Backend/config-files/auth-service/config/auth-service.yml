server:
  # Puerto interno del contenedor unificado a 8080 (igual en los 9 microservicios) -- el
  # puerto real por el que se accede a este servicio sigue siendo 8083, solo que ahora es
  # el mapeo externo de Podman (ver -p en podman-compose.sh), no el puerto en el que escucha
  # Spring Boot dentro del contenedor. Mismo patrón que se usa en el trabajo con template_gio.
  port: 8080

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://169.58.62.99:5432/defensoria_db
    username: postgres
    password: Temporal2026@
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  mail:
    host: smtp.gmail.com
    port: 587
    username: josebryanomar2004@gmail.com
    password: kstwxawsnsqkzhnk
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # Sin estos, si el proveedor del VPS bloquea el puerto 587 el envío se cuelga para siempre.
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000


  cloud:
    compatibility-verifier:
      enabled: false
    # Timeouts de los clientes Feign (QuejasClient, NotificacionesClient): sin ellos, si
    # quejas-service o notificaciones-service no responden, la activación de cuenta se cuelga.
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 10000

