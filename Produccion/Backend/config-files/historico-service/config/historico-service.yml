# historico-service -- config de PRODUCCIÓN (montada en /app/config, SPRING_CONFIG_NAME=historico-service).
# Puerto interno 8080; el externo es 8092 (ver podman-compose.sh).
server:
  port: 8080

spring:
  application:
    name: historico-service
  datasource:
    # Contenedor historico-db en el servidor BD (169.58.62.99), publicado en 5433.
    # Base SEPARADA de defensoria_db: quejas de años anteriores, solo consulta.
    url: jdbc:postgresql://169.58.62.99:5433/defensoria_historico_db
    username: postgres
    password: Temporal2026@
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 25MB

jwt:
  secret: defensoria-ddp-jwt-secret-produccion-muy-segura-2026

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    level: "%5p [${spring.application.name}]"
