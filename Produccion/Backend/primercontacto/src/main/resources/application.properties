spring.application.name=primer-contacto-service
server.port=8082

# H2 temporal
spring.datasource.url=jdbc:h2:mem:primer_contacto_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

subdefensoria.base-url=http://localhost:8083

# Origenes (separados por coma) desde los que el navegador puede
# llamar a esta API. Agrega aqui el puerto del front de Subdefensoria
# solo si algun dia llama directo desde el navegador (no es el caso
# del push server-a-server).
cors.allowed-origins=http://localhost:4300

jwt.secret=${JWT_SECRET}

# Ya no se consulta activamente a una "PlataformaCentral": las quejas
# llegan por push desde Subdefensoria a
# POST /api/primer-contacto/subdefensoria/quejas y se mantienen en
# memoria (ver QuejaEnMemoriaStore). Este microservicio corre en el
# puerto de arriba (8082); Subdefensoria corre en su propio puerto y
# es quien decide cuando llamarnos.