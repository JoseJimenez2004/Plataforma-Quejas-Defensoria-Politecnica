spring.application.name=primer-contacto-service
server.port=8082

# Base compartida "defensoria_db" -- la MISMA que ya usan auth, quejas, revision, admin,
# catalogo, notificaciones y chatbot. Antes este servicio corria con H2 en memoria
# ("H2 temporal"), lo que provocaba dos problemas de fondo:
#
#   1. personal_administrativo es un espejo de SOLO LECTURA de una tabla que vive aqui
#      (dueño: admin-service). En H2 esa tabla se creaba vacia y nadie la poblaba, asi que
#      AnalistaAutenticadoService nunca encontraba al analista del JWT y toda operacion de
#      escritura (cita, nota, dictamen, remision) respondia 401.
#
#   2. quejas.estatus es la fuente unica del ciclo de vida de la queja (ver diagrama de
#      estados). Primer Contacto tiene que poder avanzarlo --Turnada, En_Analisis,
#      Procedente, Improcedente, Remitida-- para que el quejoso vea el avance real en su
#      panel; con una base propia en memoria esos estados no los veia nadie.
#
# En el servidor esto NO se usa: la config real (PostgreSQL + JWT) vive en los config-files
# del propio servidor y no debe reemplazarse al desplegar. Aqui solo es el default de
# DESARROLLO, y apunta a la base local de dev-local/ (docker compose) a proposito: si se
# olvida definir DB_URL, lo peor que pasa es que no conecte, nunca que escriba en la base
# del servidor. Variables: ver dev-local/variables-entorno.ps1.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/defensoria_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

subdefensoria.base-url=http://localhost:8083

# Centro de notificaciones + correo del quejoso: Primer Contacto le avisa de sus citas
# (agendada, confirmada, reagendada, cancelada), de conciliaciones propuestas y de cuando
# su caso es procedente, improcedente o remitido. Mismos endpoints internos que ya usa
# revision-service (POST /api/notificaciones/registrar y /enviar).
notificaciones.service.url=http://localhost:8085

# Refleja los estados de Primer Contacto en quejas.estatus (TransicionExpedienteService).
# APAGADO hasta que el panel del quejoso (Frontend) reconozca EN_ANALISIS, PROCEDENTE,
# IMPROCEDENTE y REMITIDA; con el front actual se le mostrarian como "Recibida".
primer-contacto.sincronizar-estatus-queja=false

# Cada cuanto se revisa si el quejoso acepto un acuerdo de conciliacion (CU-PC-10).
primer-contacto.conciliacion.revision-ms=60000

# Origenes (separados por coma) desde los que el navegador puede
# llamar a esta API. Agrega aqui el puerto del front de Subdefensoria
# solo si algun dia llama directo desde el navegador (no es el caso
# del push server-a-server).
cors.allowed-origins=http://localhost:4300

jwt.secret=${JWT_SECRET}

# Citas (CU-PC-04): plazo que tiene el quejoso para confirmar o cancelar (con motivo) una
# cita, y cada cuánto se marcan como SIN_RESPUESTA las que ya vencieron.
primer-contacto.citas.horas-respuesta=48
primer-contacto.citas.revision-ms=300000

# Modelo de búsqueda de antecedentes (antecedentes-service, proyecto Modelo-Java). Vacío =
# deshabilitado: se usa el motor provisional por reglas. En el servidor:
# http://156.67.26.73:8093
antecedentes.modelo.url=${ANTECEDENTES_MODELO_URL:}
# Similitud mínima (0-1) que pide al modelo. Baja a propósito: el analista filtra en pantalla
# (>= 40%, >= 70%) y con el dataset actual del modelo los parecidos rara vez pasan de 0.15.
antecedentes.modelo.umbral=0.05

# Casos históricos (base historico_db de historico-service), solo lectura, para la búsqueda
# manual de antecedentes por quejoso o denunciado. Vacío = solo se busca en el sistema.
historico.datasource.url=${HISTORICO_DB_URL:jdbc:postgresql://localhost:5433/historico_db}
historico.datasource.username=${DB_USERNAME:postgres}
historico.datasource.password=${DB_PASSWORD:}
