server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular-Revision se compila con --base-href /revision/; el location "/" de aquí ADENTRO
    # del contenedor sigue siendo la raíz porque quien recibe el tráfico real (router-nginx)
    # es quien hace el proxy_pass hacia el puerto publicado de este contenedor.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
