<h2 mat-dialog-title>Gestión de Respuesta Externa</h2>

<mat-dialog-content>
  <p class="folio-line">Oficio <strong>{{ data.numeroOficio }}</strong> · Enviado a {{ data.destinatarioNombre }}</p>

  <mat-form-field appearance="outline">
    <mat-label>Canal de recepción</mat-label>
    <input matInput [(ngModel)]="canalRecepcion" placeholder="Ej. Correo institucional, oficialía de partes">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Número de oficio de respuesta de la UA</mat-label>
    <input matInput [(ngModel)]="numeroOficioRespuestaUA">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Resumen de la información recibida</mat-label>
    <textarea matInput rows="5" [(ngModel)]="resumen"></textarea>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cancelar()">Cancelar</button>
  <button mat-flat-button class="primary-btn" [disabled]="enviando" (click)="confirmar()">
    <mat-icon>check</mat-icon>
    Confirmar Registro
  </button>
</mat-dialog-actions>
