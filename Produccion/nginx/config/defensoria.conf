server {
    listen 80;
    server_name defensoria-escom.ddns.net;

    # Límite de tamaño de subida (varios archivos por queja, hasta 60MB+overhead de multipart)
    client_max_body_size 100M;

    # 1. RUTA PARA EL FRONTEND (Archivos estáticos)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # Vital Angular
    }

    # 2. PROXY HACIA AUTH-SERVICE (Puerto 8083)
    location /api/auth/ {
        proxy_pass http://2.25.78.22:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. PROXY HACIA QUEJAS-SERVICE (Puerto 8084)
    location /api/quejoso/ {
        proxy_pass http://2.25.78.22:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. PROXY HACIA NOTIFICACIONES-SERVICE (Puerto 8085)
    location /api/notificaciones/ {
        proxy_pass http://2.25.78.22:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 5. PROXY HACIA CATALOGO-SERVICE (Puerto 8086)
    # Faltaba esta ruta — sin ella, /api/catalogos/* caía en el location "/" de arriba y
    # nginx devolvía el index.html de Angular (try_files) en vez de la respuesta JSON real,
    # por eso el catálogo de dependencias nunca cargaba en el formulario de registro.
    location /api/catalogos/ {
        proxy_pass http://2.25.78.22:8086;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 6. PROXY HACIA ADMIN-SERVICE (Puerto 8087) -- consola de administracion del sistema
    location /api/admin/ {
        proxy_pass http://2.25.78.22:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 7. PANEL DE ADMINISTRACION (Angular nuevo, corre en su propio contenedor "admin-web"
    # publicado en el puerto 22346 de esta MISMA vps de frontend -- igual que "front" publica
    # su 22345). OJO: este bloque vive DENTRO del contenedor "front" (no usa --network host),
    # así que "127.0.0.1" apuntaría al propio contenedor, no a la vps; por eso se usa la IP
    # real de esta vps, mismo patrón que ya usan los bloques de arriba hacia el backend.
    location /admin/ {
        proxy_pass http://2.25.64.47:22346/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 8. PROXY HACIA REVISION-SERVICE (Puerto 8088) -- bandeja/validacion/turnado del personal
    # de revision (recepcionista y, mas adelante, analista/subdefensor/defensor).
    location /api/revision/ {
        proxy_pass http://2.25.78.22:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 9. PANEL DE REVISION (Angular nuevo, su propio contenedor "revision-web" publicado en el
    # puerto 22347 de esta MISMA vps de frontend -- mismo patron que "admin-web" en 22346).
    location /revision/ {
        proxy_pass http://127.0.0.1:22347/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 10. PROXY HACIA CHATBOT-SERVICE (Puerto 8089) -- menu de preguntas preseleccionadas
    # (mini-chat/tutorial) que consume el portal del quejoso. Publico, sin login.
    location /api/chatbot/ {
        proxy_pass http://2.25.78.22:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
