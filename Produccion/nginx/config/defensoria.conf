server {
    listen 80;
    server_name defensoria-escom.ddns.net;

    # Límite de tamaño de subida (varios archivos por queja, hasta 60MB+overhead de multipart)
    client_max_body_size 100M;

    # 1. RUTA PARA EL FRONTEND (Archivos estáticos)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # Vital Angular
    }

    # 2. PROXY HACIA AUTH-SERVICE (Puerto 8083)
    location /api/auth/ {
        proxy_pass http://2.25.78.22:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. PROXY HACIA QUEJAS-SERVICE (Puerto 8084)
    location /api/quejoso/ {
        proxy_pass http://2.25.78.22:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. PROXY HACIA NOTIFICACIONES-SERVICE (Puerto 8085)
    location /api/notificaciones/ {
        proxy_pass http://2.25.78.22:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 5. PROXY HACIA CATALOGO-SERVICE (Puerto 8086)
    # Faltaba esta ruta — sin ella, /api/catalogos/* caía en el location "/" de arriba y
    # nginx devolvía el index.html de Angular (try_files) en vez de la respuesta JSON real,
    # por eso el catálogo de dependencias nunca cargaba en el formulario de registro.
    location /api/catalogos/ {
        proxy_pass http://2.25.78.22:8086;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
