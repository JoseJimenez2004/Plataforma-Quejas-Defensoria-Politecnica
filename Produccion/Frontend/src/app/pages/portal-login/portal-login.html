<div class="contenedor">
  <div class="card">
    <h2>Portal de Seguimiento de Quejas</h2>
    <p class="subtitulo">Ingresa tus credenciales para gestionar tus trámites.</p>

    <form (submit)="$event.preventDefault(); ingresar()">
      <div class="input-group">
        <label>Usuario / Correo</label>
        <input type="email" [(ngModel)]="correo" name="correo" required placeholder="ejemplo@ipn.mx" />
      </div>
      <div class="input-group">
        <label>Contraseña</label>
        <div class="campo-password">
          <input
            [type]="mostrarPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            required
            placeholder="********"
          />
          <button
            type="button"
            class="alternar-password"
            (click)="mostrarPassword = !mostrarPassword"
            [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            {{ mostrarPassword ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      @if (error) {
        <p class="error">{{ error }}</p>
      }

      <button type="submit" class="btn-primary" [disabled]="cargando">
        {{ cargando ? 'Ingresando…' : 'Iniciar Sesión' }}
      </button>
    </form>

    <div class="footer-links">
      <a routerLink="/portal/recuperar">¿Olvidaste tu contraseña?</a>
      <p>¿No tienes cuenta? <a routerLink="/cuenta/crear">¡Regístrate aquí!</a></p>
    </div>
  </div>
</div>
