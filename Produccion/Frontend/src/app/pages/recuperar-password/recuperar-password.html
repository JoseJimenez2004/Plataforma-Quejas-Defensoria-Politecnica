<div class="contenedor">
  <div class="card">
    @if (paso === 1) {
      <h2>🔓 Restablecer Contraseña</h2>
      <p class="subtitulo">
        Introduce tu correo electrónico institucional o el correo registrado para recibir un
        código de recuperación.
      </p>

      <form (submit)="$event.preventDefault(); solicitarCodigo()">
        <div class="input-group">
          <input type="email" [(ngModel)]="correo" name="correo" placeholder="ejemplo@ipn.mx" required />
        </div>

        @if (error) {
          <p class="error">{{ error }}</p>
        }

        <button type="submit" class="btn-primary" [disabled]="cargando">
          {{ cargando ? 'Enviando…' : 'Enviar Enlace de Recuperación' }}
        </button>
      </form>
    } @else {
      <h2>Ingresa el código</h2>
      <p class="subtitulo">{{ mensaje }}</p>

      <form (submit)="$event.preventDefault(); restablecer()">
        <div class="input-group">
          <label>Código de verificación</label>
          <input type="text" [(ngModel)]="codigo" name="codigo" maxlength="6" required />
        </div>
        <div class="input-group">
          <label>Nueva contraseña</label>
          <input type="password" [(ngModel)]="nuevaPassword" name="nuevaPassword" required />
        </div>
        <div class="input-group">
          <label>Confirmar contraseña</label>
          <input type="password" [(ngModel)]="confirmarPassword" name="confirmarPassword" required />
        </div>

        @if (error) {
          <p class="error">{{ error }}</p>
        }

        <button type="submit" class="btn-primary" [disabled]="cargando">
          {{ cargando ? 'Guardando…' : 'Restablecer Contraseña' }}
        </button>
      </form>
    }

    <a routerLink="/portal/login" class="volver">Volver al inicio de sesión</a>
  </div>
</div>
