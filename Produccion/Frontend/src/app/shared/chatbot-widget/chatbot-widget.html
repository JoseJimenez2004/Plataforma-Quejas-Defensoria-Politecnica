@if (abierto) {
  <div class="chatbot-panel" role="dialog" aria-label="Asistente de la Defensoría">
    <div class="chatbot-panel__header">
      <div class="chatbot-panel__marca">
        <span class="chatbot-mascota-mini" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <defs>
              <linearGradient id="botHeadMini" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#a8305c" />
                <stop offset="100%" stop-color="#501533" />
              </linearGradient>
              <radialGradient id="botEyeMini" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#eafcff" />
                <stop offset="55%" stop-color="#5be2ff" />
                <stop offset="100%" stop-color="#1aa9d6" />
              </radialGradient>
            </defs>
            <circle cx="32" cy="32" r="28" fill="url(#botHeadMini)" />
            <rect x="17" y="20" width="30" height="22" rx="11" fill="#fff" opacity="0.96" />
            <circle cx="25.5" cy="31" r="3.8" fill="url(#botEyeMini)" />
            <circle cx="38.5" cy="31" r="3.8" fill="url(#botEyeMini)" />
            <path d="M26 38h12" stroke="var(--guinda)" stroke-width="2" stroke-linecap="round" />
          </svg>
        </span>
        <div>
          <strong>Asistente DDP</strong>
          <span class="chatbot-estado"><span class="chatbot-estado__punto" aria-hidden="true"></span>En línea</span>
        </div>
      </div>
      <button class="chatbot-panel__cerrar" type="button" (click)="cerrar()" aria-label="Cerrar asistente">
        ✕
      </button>
    </div>

    <div class="chatbot-panel__cuerpo">
      @if (cargando) {
        <p class="chatbot-cargando">Cargando información…</p>
      }

      @for (mensaje of mensajes; track $index) {
        <div class="chatbot-burbuja" [class.chatbot-burbuja--usuario]="mensaje.autor === 'usuario'">
          {{ mensaje.texto }}
        </div>
      }

      @if (opciones.length > 0) {
        <div class="chatbot-opciones">
          @for (opcion of opciones; track opcion.texto) {
            <button type="button" class="chatbot-opcion" (click)="elegir(opcion)">
              {{ opcion.texto }}
            </button>
          }
        </div>
      }
    </div>
  </div>
}

<button
  type="button"
  class="chatbot-fab"
  [class.chatbot-fab--activo]="abierto"
  (click)="alternarPanel()"
  aria-label="Abrir asistente de la Defensoría"
>
  @if (!abierto) {
    <span class="chatbot-fab__onda chatbot-fab__onda--1" aria-hidden="true"></span>
    <span class="chatbot-fab__onda chatbot-fab__onda--2" aria-hidden="true"></span>
    <span class="chatbot-fab__onda chatbot-fab__onda--3" aria-hidden="true"></span>
  }
  <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
    <defs>
      <linearGradient id="botHead" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#a8305c" />
        <stop offset="100%" stop-color="#501533" />
      </linearGradient>
      <radialGradient id="botEye" cx="35%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#eafcff" />
        <stop offset="55%" stop-color="#5be2ff" />
        <stop offset="100%" stop-color="#1aa9d6" />
      </radialGradient>
    </defs>
    <circle cx="32" cy="32" r="30" fill="url(#botHead)" />
    <rect x="16" y="20" width="32" height="24" rx="12" fill="#fff" opacity="0.96" />
    <circle cx="25" cy="32" r="4.2" fill="url(#botEye)" />
    <circle cx="39" cy="32" r="4.2" fill="url(#botEye)" />
    <path d="M25 40h14" stroke="var(--guinda)" stroke-width="2" stroke-linecap="round" />
  </svg>
</button>
