<ul class="requisitos">
  <li [class.cumplido]="tieneLongitud">
    <span class="marca">{{ tieneLongitud ? '✓' : '' }}</span>
    Mínimo 8 caracteres
  </li>
  <li [class.cumplido]="tieneMayuscula">
    <span class="marca">{{ tieneMayuscula ? '✓' : '' }}</span>
    Una letra mayúscula
  </li>
  <li [class.cumplido]="tieneNumero">
    <span class="marca">{{ tieneNumero ? '✓' : '' }}</span>
    Un número
  </li>
</ul>
