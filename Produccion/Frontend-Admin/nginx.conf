server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular-Admin se compila con --base-href /admin/, así que sus propios assets ya
    # esperan vivir bajo ese prefijo; el location "/" de aquí ADENTRO del contenedor sigue
    # siendo la raíz porque el contenedor "front" (que es quien de verdad recibe el tráfico
    # de defensoria.conf) es quien hace el proxy_pass hacia el puerto publicado de este
    # contenedor (ver podman-compose-front-admin.sh).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
